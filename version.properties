# ---------------------------------------------------------------------------
# The single source of truth for the app's version.
#
# WHY THIS FILE EXISTS
# Android refuses to install an APK whose VERSION_CODE is the same as, or lower
# than, the copy already on the phone.  It fails with "App not installed" and
# no useful explanation.  That is almost always the cause of an update that
# "does nothing" or silently keeps the old build.
#
# So VERSION_CODE must increase on EVERY build you install.  Never edit it
# downwards, and never reuse one.
#
# HOW TO BUMP IT
#   ./gradlew bumpPatch     1.0.0 -> 1.0.1   a fix
#   ./gradlew bumpMinor     1.0.1 -> 1.1.0   a new feature
#   ./gradlew bumpMajor     1.1.0 -> 2.0.0   a big change
#
# Each of those also increases VERSION_CODE by one.  The GitHub Actions build
# raises VERSION_CODE further using the run number, so two builds of the same
# version name can still never collide.
# ---------------------------------------------------------------------------

# Shown to people: "Version 1.1.0".
VERSION_MAJOR=1
VERSION_MINOR=10
VERSION_PATCH=0

# Used by Android to decide what counts as newer. Must only ever go up.
VERSION_CODE=340
