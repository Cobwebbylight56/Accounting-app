name: Build APK

# Builds an installable APK on every push, and publishes a permanent download
# link whenever a version tag is pushed.
#
#   Every push       -> APK attached to the run, under the Actions tab
#   Tag "v1.2.0"     -> GitHub Release with the APK on it, at a fixed URL
#
# The fixed URL never changes, so it can be bookmarked on a phone:
#   https://github.com/Cobwebbylight56/Accounting-app/releases/latest/download/finance-tracker.apk

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Secrets cannot be read from a step-level `if`, but env can, so the
      # signing key is surfaced here and the step tests for it below.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The version-bump commits need the full history to be readable.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read the version
        id: version
        run: |
          # BUILD_NUMBER is added to VERSION_CODE by app/build.gradle.kts, so two
          # builds of the same version name can never collide on the phone.
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2)
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2)
          BASE=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "code=$((BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore the signing key
        # Only when a real key has been configured; otherwise the build falls
        # back to the committed debug key, which is still installable.
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Give it a stable name
        run: |
          # One predictable name, so the "latest download" link never changes.
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/finance-tracker.apk
          cp app/build/outputs/apk/release/*.apk \
             "artifacts/finance-tracker-${{ steps.version.outputs.name }}.apk"
          ls -la artifacts

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          name: Finance Tracker ${{ steps.version.outputs.name }}
          body: |
            **Version ${{ steps.version.outputs.name }}** · version code ${{ steps.version.outputs.code }}

            ### Install it
            Open this on the phone and tap `finance-tracker.apk`. Android will ask
            once for permission to install from this source.

            Always-latest link, safe to bookmark:
            <https://github.com/${{ github.repository }}/releases/latest/download/finance-tracker.apk>

            ### Updating
            Installing over an existing copy keeps all your data. Every build has
            a higher version code than the last, so an update is never refused as
            "already installed".
